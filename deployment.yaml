apiVersion: apps/v1
kind: Deployment

metadata:
  name: trend-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: trend

  template:
    metadata:
      labels:
        app: trend

    spec:
      containers:
      - name: trend-container
        image: jefryjo/trend-app:latest
        imagePullPolicy: Always

        ports:
        - containerPort: 80
